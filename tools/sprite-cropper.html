<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phantom Sprite Cropper</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; background: #17120f; color: #f7e7c1; }
    body { max-width: 900px; margin: 0 auto; padding: 24px; }
    h1 { margin-top: 0; color: #f2c46d; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; }
    button, input { font: inherit; }
    button { padding: 8px 12px; border: 1px solid #f2c46d; border-radius: 6px; background: #3b2b20; color: #fff3d1; cursor: pointer; }
    canvas { display: block; max-width: 100%; margin: 16px 0; image-rendering: pixelated; background: repeating-conic-gradient(#332820 0 25%, #211a16 0 50%) 0 / 16px 16px; border: 1px solid #6f5435; }
    code { color: #f2c46d; }
    #info { color: #b9a995; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>Sprite Cropper</h1>
  <p>选择带透明留白的 PNG，工具会按 alpha 边界裁剪并生成静态 PNG。生成后放入 <code>images/generated/</code>。</p>
  <div class="toolbar">
    <input id="file" type="file" accept="image/png,image/webp,image/*">
    <label>Alpha 阈值 <input id="threshold" type="number" min="0" max="255" value="8"></label>
    <button id="crop" type="button">裁剪预览</button>
    <button id="download" type="button" disabled>下载裁剪 PNG</button>
  </div>
  <canvas id="preview" width="1" height="1"></canvas>
  <div id="info">尚未选择图片</div>
  <script>
    const file = document.getElementById('file');
    const threshold = document.getElementById('threshold');
    const preview = document.getElementById('preview');
    const info = document.getElementById('info');
    const cropButton = document.getElementById('crop');
    const downloadButton = document.getElementById('download');
    let source;
    let result;
    file.addEventListener('change', () => {
      const selected = file.files[0];
      if (!selected) return;
      source = new Image();
      source.onload = () => { info.textContent = `原图 ${source.naturalWidth} × ${source.naturalHeight}，点击“裁剪预览”生成静态贴图`; };
      source.src = URL.createObjectURL(selected);
    });
    cropButton.addEventListener('click', () => {
      if (!source) return;
      const sourceCanvas = document.createElement('canvas');
      sourceCanvas.width = source.naturalWidth; sourceCanvas.height = source.naturalHeight;
      const sourceContext = sourceCanvas.getContext('2d'); sourceContext.drawImage(source, 0, 0);
      const pixels = sourceContext.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height).data;
      const limit = Number(threshold.value) || 0; let left = sourceCanvas.width, top = sourceCanvas.height, right = -1, bottom = -1;
      for (let y = 0; y < sourceCanvas.height; y++) for (let x = 0; x < sourceCanvas.width; x++) if (pixels[(y * sourceCanvas.width + x) * 4 + 3] > limit) { left = Math.min(left, x); top = Math.min(top, y); right = Math.max(right, x); bottom = Math.max(bottom, y); }
      if (right < 0) { info.textContent = '没有找到不透明像素'; return; }
      result = document.createElement('canvas'); result.width = right - left + 1; result.height = bottom - top + 1;
      result.getContext('2d').drawImage(sourceCanvas, left, top, result.width, result.height, 0, 0, result.width, result.height);
      preview.width = result.width; preview.height = result.height; preview.getContext('2d').drawImage(result, 0, 0);
      info.textContent = `裁剪区域 left=${left}, top=${top}, width=${result.width}, height=${result.height}`; downloadButton.disabled = false;
    });
    downloadButton.addEventListener('click', () => { if (!result) return; const link = document.createElement('a'); link.download = 'hero-trimmed.png'; link.href = result.toDataURL('image/png'); link.click(); });
  </script>
</body>
</html>
